settings:
  APP_DISPLAY_NAME: Halo X
  PRODUCTION_APP_NAME: Halo
  APP_GROUP_IDENTIFIER: group.com.evan1ee.elementx
  BASE_BUNDLE_IDENTIFIER: com.evan1ee.elementx
  ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: "colors/accent-color"
  DEVELOPMENT_TEAM: RN9SLQ2637
  IS_NIGHTLY_BUILD: false

  # The iCloud Drive backup container. Deliberately its own setting rather than
  # derived from the bundle identifier: container IDs are unique across every Apple
  # developer account, so the one matching your bundle ID may already be taken and
  # you have to be free to pick another. Must match a container registered to this
  # team, or the iCloud provider reports itself unavailable and is hidden.
  ICLOUD_CONTAINER_IDENTIFIER: iCloud.com.evan1ee.elementx

  # Optional configuration to load accounts from Element Classic.
  CLASSIC_APP_GROUP_IDENTIFIER: group.im.vector
  CLASSIC_APP_KEYCHAIN_SERVICE_IDENTIFIER: im.vector.app.encryption-manager-service
  CLASSIC_APP_KEYCHAIN_ACCESS_GROUP_IDENTIFIER: "$(DEVELOPMENT_TEAM).im.vector.app.keychain.shared"
  CLASSIC_APP_DEEP_LINK_URL: "element://open"
